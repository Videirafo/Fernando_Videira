<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Engineering Stack Map</title><desc id="desc">Fernando Videira engineering stack across frontend, backend, data and platform.</desc><rect width="1200" height="360" rx="24" fill="#0d1117"/><text x="60" y="62" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Engineering Stack</text><text x="60" y="94" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="17">Technologies and disciplines used across product engineering.</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="60" y="128" width="250" height="170" rx="18" fill="#161b22" stroke="#30363d"/><text x="82" y="160" fill="#58a6ff" font-size="20" font-weight="700">Frontend</text><text x="82" y="194" fill="#c9d1d9" font-size="17">Next.js · React</text><text x="82" y="222" fill="#c9d1d9" font-size="17">TypeScript · JavaScript</text><text x="82" y="250" fill="#c9d1d9" font-size="17">Tailwind · HTML · CSS</text><text x="82" y="278" fill="#8b949e" font-size="15">UX · responsive · accessibility</text><rect x="330" y="128" width="250" height="170" rx="18" fill="#161b22" stroke="#30363d"/><text x="352" y="160" fill="#a371f7" font-size="20" font-weight="700">Backend &amp; APIs</text><text x="352" y="194" fill="#c9d1d9" font-size="17">Node.js · Python</text><text x="352" y="222" fill="#c9d1d9" font-size="17">Django · FastAPI</text><text x="352" y="250" fill="#c9d1d9" font-size="17">REST · OpenAPI · Async</text><text x="352" y="278" fill="#8b949e" font-size="15">auth · services · integrations</text><rect x="600" y="128" width="250" height="170" rx="18" fill="#161b22" stroke="#30363d"/><text x="622" y="160" fill="#3fb950" font-size="20" font-weight="700">Data &amp; SaaS</text><text x="622" y="194" fill="#c9d1d9" font-size="17">PostgreSQL · Supabase</text><text x="622" y="222" fill="#c9d1d9" font-size="17">Redis · multi-tenancy</text><text x="622" y="250" fill="#c9d1d9" font-size="17">RLS · migrations · audit</text><text x="622" y="278" fill="#8b949e" font-size="15">isolation · contracts · data quality</text><rect x="870" y="128" width="270" height="170" rx="18" fill="#161b22" stroke="#30363d"/><text x="892" y="160" fill="#d29922" font-size="20" font-weight="700">Platform &amp; Quality</text><text x="892" y="194" fill="#c9d1d9" font-size="17">Linux · Docker · Nginx</text><text x="892" y="222" fill="#c9d1d9" font-size="17">GitHub Actions · Vercel</text><text x="892" y="250" fill="#c9d1d9" font-size="17">Tests · Security · Observability</text><text x="892" y="278" fill="#8b949e" font-size="15">deploy · backup · rollback · CI/CD</text></g></svg>