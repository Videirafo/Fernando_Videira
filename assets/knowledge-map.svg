<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Knowledge Base Map</title><desc id="desc">Map of Fernando Videira reusable engineering skills and systems.</desc><rect width="1200" height="390" rx="24" fill="#0d1117"/><text x="60" y="58" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Knowledge Base</text><text x="60" y="90" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="17">Reusable engineering systems organized around one operating model.</text><g font-family="Segoe UI,Arial,sans-serif"><rect x="390" y="118" width="420" height="66" rx="18" fill="#1f6feb"/><text x="600" y="146" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">VIDEIRA OMEGA STUDIO OS</text><text x="600" y="169" text-anchor="middle" fill="#dbeafe" font-size="14">Recall → Specify → Build → Test → Ship → Observe → Learn</text><g fill="#161b22" stroke="#30363d"><rect x="60" y="226" width="250" height="112" rx="16"/><rect x="330" y="226" width="250" height="112" rx="16"/><rect x="600" y="226" width="250" height="112" rx="16"/><rect x="870" y="226" width="270" height="112" rx="16"/></g><text x="82" y="258" fill="#58a6ff" font-size="18" font-weight="700">Modeling &amp; Architecture</text><text x="82" y="288" fill="#c9d1d9" font-size="15">UML · BPMN · C4 · ERD</text><text x="82" y="314" fill="#c9d1d9" font-size="15">ADR · OpenAPI · traceability</text><text x="352" y="258" fill="#a371f7" font-size="18" font-weight="700">AI Engineering</text><text x="352" y="288" fill="#c9d1d9" font-size="15">RAG · GraphRAG · tools · MCP</text><text x="352" y="314" fill="#c9d1d9" font-size="15">guardrails · evals · handoff</text><text x="622" y="258" fill="#3fb950" font-size="18" font-weight="700">Product Engineering</text><text x="622" y="288" fill="#c9d1d9" font-size="15">SaaS · CRM · scheduling</text><text x="622" y="314" fill="#c9d1d9" font-size="15">