[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-health-auditor"
version = "0.1.0"
description = "CLI to audit public GitHub repository health using the official REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
repo-health = "repo_health_auditor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
