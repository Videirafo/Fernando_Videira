name: RepoGuard GitHub App

on:
  pull_request:
    paths:
      - 'projects/repoguard-github-app/**'
      - '.github/workflows/repoguard-github-app.yml'
  push:
    branches: [main]
    paths:
      - 'projects/repoguard-github-app/**'
      - '.github/workflows/repoguard-github-app.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/repoguard-github-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
