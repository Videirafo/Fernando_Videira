name: Repo Health Auditor

on:
  pull_request:
    paths:
      - "projects/github-repo-health-auditor/**"
      - ".github/workflows/repo-health-auditor.yml"
  push:
    branches: [main]
    paths:
      - "projects/github-repo-health-auditor/**"
      - ".github/workflows/repo-health-auditor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/github-repo-health-auditor
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/github-repo-health-auditor/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: CLI smoke test
        run: python -m repo_health_auditor.cli --help
