name: MCP Policy Firewall Lab

on:
  pull_request:
    paths:
      - 'projects/mcp-policy-firewall-lab/**'
      - '.github/workflows/mcp-policy-firewall.yml'
  push:
    branches: [main]
    paths:
      - 'projects/mcp-policy-firewall-lab/**'
      - '.github/workflows/mcp-policy-firewall.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mcp-policy-firewall-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run demo:allow
      - name: Deny demo should deny with exit code 2
        run: |
          set +e
          npm run demo:deny
          code=$?
          set -e
          test "$code" -eq 2
