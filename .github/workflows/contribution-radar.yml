name: Open Source Contribution Radar

on:
  push:
    branches: [main]
    paths:
      - "projects/open-source-contribution-radar/**"
      - ".github/workflows/contribution-radar.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/open-source-contribution-radar/**"
      - ".github/workflows/contribution-radar.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/open-source-contribution-radar

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test
